<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Test SCS · 300</title>
<meta name="theme-color" content="#0055aa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#fff;--fg:#111;--card:#f4f4f4;--btn:#0055aa;--btn-fg:#fff;--ok:#1b7a1b;--ko:#b00020;--border:#ccc;--mic:#c62828}
[data-theme="dark"]{--bg:#111;--fg:#f0f0f0;--card:#1e1e1e;--btn:#3399ff;--btn-fg:#000;--ok:#4caf50;--ko:#ff5252;--border:#444;--mic:#ff5252}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:20px;line-height:1.5}
header{position:sticky;top:0;background:var(--bg);border-bottom:2px solid var(--border);padding:10px;display:flex;flex-direction:column;gap:10px;z-index:10}
.header-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.header-top h1{font-size:1.2rem;margin:0;}
.header-top .stats{font-size:0.95rem;font-weight:bold;margin-right:auto;padding-left:10px;}
.header-top button{font-size:1rem;padding:8px 12px;cursor:pointer;border-radius:8px;border:2px solid var(--border);background:var(--card);color:var(--fg)}
.header-config{display:flex;flex-wrap:wrap;gap:15px;align-items:center;justify-content:center;font-size:0.95rem;background:var(--card);padding:10px;border-radius:10px;border:1px solid var(--border)}
.header-config select{padding:8px;border-radius:8px;font-size:1rem;border:1px solid var(--border);background:var(--bg);color:var(--fg);max-width:200px;}
.header-config input[type="range"]{width:120px;cursor:pointer;}
.header-config button{padding:8px 12px;border-radius:8px;background:var(--btn);color:var(--btn-fg);border:none;cursor:pointer;font-size:0.9rem}

main{padding:15px;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:15px;}
.pregunta{background:var(--card);border-radius:12px;padding:15px}
.num{font-weight:bold;font-size:1.1rem;margin-bottom:10px}
.enunciado{font-size:1.15rem;margin-bottom:15px}
.opciones{display:flex;flex-direction:column;gap:10px}
.opcion{background:var(--bg);color:var(--fg);border:2px solid var(--border);border-radius:10px;padding:15px;font-size:1.1rem;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-family:inherit}
.opcion .letra{font-weight:bold;font-size:1.3rem;min-width:2rem;color:var(--btn)}
.opcion.correct{border-color:var(--ok);background:rgba(76,175,80,.2)}
.opcion.wrong{border-color:var(--ko);background:rgba(255,82,82,.2)}
.opcion:disabled{cursor:default}
.resultado{margin-top:15px;font-size:1.2rem;font-weight:bold;padding:10px;border-radius:10px;display:none}
.resultado.ok{background:rgba(76,175,80,.25);color:var(--ok);display:block}
.resultado.ko{background:rgba(255,82,82,.25);color:var(--ko);display:block}

.mic-section{display:flex;flex-direction:column;align-items:center;gap:10px;margin:10px 0}
.btn-mic-huge{width:120px;height:120px;border-radius:50%;font-size:4.5rem;background:var(--mic);color:#fff;border:none;box-shadow:0 6px 12px rgba(0,0,0,0.2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.1s, background 0.3s}
.btn-mic-huge:active{transform:scale(0.95)}
.btn-mic-huge.escuchando{animation:pulse-huge 1.5s infinite}
.btn-mic-huge.handsfree{background:var(--ok)}
@keyframes pulse-huge{0%{box-shadow:0 0 0 0 rgba(198,40,40,0.7)}70%{box-shadow:0 0 0 30px rgba(198,40,40,0)}100%{box-shadow:0 0 0 0 rgba(198,40,40,0)}}
.mic-status{font-size:1rem;font-weight:bold;color:var(--btn);text-align:center;min-height:1.5em}
.switch-label{display:flex;align-items:center;gap:8px;font-size:1rem;font-weight:bold;cursor:pointer;background:var(--card);padding:8px 15px;border-radius:20px;border:1px solid var(--border)}
.switch-label input{width:20px;height:20px;cursor:pointer}

.controls-row-3{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.controls-row-3 button{flex:1;min-width:100px;padding:15px;font-size:1.1rem;border-radius:10px;background:var(--card);color:var(--fg);border:2px solid var(--border);font-weight:bold;cursor:pointer}
.controls-row-3 button.primary{background:var(--btn);color:var(--btn-fg);border:none}
.controls-row-2{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.controls-row-2 button{flex:1;max-width:250px;padding:12px;font-size:1rem;border-radius:10px;background:var(--card);color:var(--fg);border:2px solid var(--border);font-weight:bold;cursor:pointer}

@media (max-width:600px){body{font-size:18px}.opcion{font-size:1rem}.enunciado{font-size:1.05rem}.btn-mic-huge{width:100px;height:100px;font-size:3.5rem}}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <h1>Test SCS · <span id="prog">0/300</span></h1>
    <div class="stats">✅ <span id="okCount">0</span> · ❌ <span id="koCount">0</span></div>
    <button id="btnTheme" title="Claro/oscuro">🌓</button>
    <button id="btnAudio" title="Voz alta activada">🔊</button>
  </div>
  <div class="header-config">
    <label>Voz: <select id="voiceSelect"></select></label>
    <label>Vel: <input type="range" id="rateSlider" min="0.5" max="1.5" step="0.1" value="0.95"> <span id="rateValue">0.95x</span></label>
    <button id="testVoice">▶ Probar</button>
  </div>
</header>
<main>
  <div class="pregunta">
    <div class="num" id="num">Cargando…</div>
    <div class="enunciado" id="enunciado"></div>
    <div class="opciones" id="opciones"></div>
    <div class="resultado" id="resultado"></div>
  </div>
  
  <div class="mic-section">
    <button id="micBtn" class="btn-mic-huge" title="Hablar">🎤</button>
    <div class="mic-status" id="micStatus">Pulsa el micro para hablar</div>
    <label class="switch-label">
      <input type="checkbox" id="handsfreeToggle">
      Modo manos libres (escucha automática)
    </label>
  </div>

  <div class="controls-row-3">
    <button id="repeat">🔁 Repetir</button>
    <button id="prev">◀ Anterior</button>
    <button id="next" class="primary">Siguiente ▶</button>
  </div>

  <div class="controls-row-2">
    <button id="failedMode">📋 Solo falladas</button>
    <button id="restart">🔄 Reiniciar</button>
  </div>
</main>
<script src="preguntas.js"></script>
<script>
(function(){
  'use strict';
  const S_KEY='test_scs_v2';
  const listState={answers:{}};
  let currentIdx=0, failedOnly=false, audioOn=true, handsfree=false, listening=false;
  const synth=window.speechSynthesis;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let recognition=null;
  let selectedVoice=null;

  const $ = id => document.getElementById(id);
  const rateSlider = $('rateSlider');
  const rateValue = $('rateValue');
  const handsfreeToggle = $('handsfreeToggle');
  const micBtn = $('micBtn');

  function loadState(){
    try{const s=JSON.parse(localStorage.getItem(S_KEY));if(s&&s.answers)Object.assign(listState,s);}catch(e){}
  }
  function saveState(){localStorage.setItem(S_KEY,JSON.stringify(listState));}
  
  function isFailed(p) {
    const chosen = listState.answers[p.n];
    return chosen !== undefined && chosen !== p.a;
  }

  function getList(){
    if(!failedOnly) return PREGUNTAS;
    return PREGUNTAS.filter(p => isFailed(p));
  }

  const savedRate = localStorage.getItem('test_scs_rate');
  if(savedRate) {
    rateSlider.value = savedRate;
    rateValue.textContent = savedRate + 'x';
  }
  rateSlider.oninput = () => {
    localStorage.setItem('test_scs_rate', rateSlider.value);
    rateValue.textContent = rateSlider.value + 'x';
  };

  function cargarVoces(){
    if(!synth)return;
    const voces = synth.getVoices();
    const selector = $('voiceSelect');
    selector.innerHTML = '';
    
    const vocesEsp = voces.filter(v => v.lang.startsWith('es'));
    if(vocesEsp.length === 0) {
        voces.forEach(v => selector.add(new Option(v.name, v.name)));
    } else {
        vocesEsp.forEach(v => selector.add(new Option(v.name, v.name)));
    }

    const guardada = localStorage.getItem('test_scs_voice');
    if(guardada) {
        for(let i=0; i<selector.options.length; i++){
            if(selector.options[i].value === guardada) {
                selector.selectedIndex = i;
                break;
            }
        }
    } else {
        const masculinas = ["pablo", "raul", "jorge", "diego", "enrique", "hombre", "male"];
        for(let i=0; i<selector.options.length; i++){
            const nombre = selector.options[i].value.toLowerCase();
            if(masculinas.some(m => nombre.includes(m))){
                selector.selectedIndex = i;
                break;
            }
        }
    }
    actualizarVozSeleccionada();
  }

  function actualizarVozSeleccionada(){
    const nombre = $('voiceSelect').value;
    const voces = synth.getVoices();
    selectedVoice = voces.find(v => v.name === nombre);
    localStorage.setItem('test_scs_voice', nombre);
  }

  $('voiceSelect').onchange = actualizarVozSeleccionada;

  $('testVoice').onclick = () => {
    stopSpeak();
    const u = new SpeechSynthesisUtterance("Hola, esta es una prueba de voz. Pregunta número uno. Opción dos.");
    if(selectedVoice) u.voice = selectedVoice;
    u.lang = 'es-ES';
    u.pitch = 0.8;
    u.rate = parseFloat(rateSlider.value);
    synth.speak(u);
  };

  function speak(text, onEnd) {
    if(!audioOn || !synth) { if(onEnd) onEnd(); return; }
    synth.cancel();
    const u=new SpeechSynthesisUtterance(text);
    if(selectedVoice) u.voice = selectedVoice;
    u.lang='es-ES';
    u.pitch=0.8;
    u.rate=parseFloat(rateSlider.value);
    u.onend = () => {
      if(onEnd) onEnd();
    };
    synth.speak(u);
  }
  function stopSpeak(){if(synth)synth.cancel();}

  function checkLoad(){
    if(typeof PREGUNTAS==='undefined'){
      $('num').textContent='ERROR: no se ha cargado preguntas.js';
      $('enunciado').textContent='Asegúrate de que el archivo preguntas.js está en la MISMA carpeta que index.html y termina con "];".';
      return false;
    }
    if(!Array.isArray(PREGUNTAS)||PREGUNTAS.length===0){
      $('num').textContent='ERROR: preguntas.js está vacío o mal formado.';
      return false;
    }
    return true;
  }

  function render(){
    const list=getList();
    const numEl=$('num'), enEl=$('enunciado'), opcEl=$('opciones'), resEl=$('resultado');
    if(list.length===0){
      numEl.textContent='No hay preguntas para mostrar.';
      enEl.textContent='';opcEl.innerHTML='';resEl.style.display='none';
      updateStats();return;
    }
    if(currentIdx>=list.length)currentIdx=list.length-1;
    if(currentIdx<0)currentIdx=0;
    const p=list[currentIdx];
    numEl.textContent='Pregunta '+p.n;
    enEl.textContent=p.q;
    opcEl.innerHTML='';
    const prev=listState.answers[p.n];
    const letras=['1','2','3','4'];
    p.o.forEach((op,i)=>{
      const b=document.createElement('button');
      b.className='opcion';
      b.dataset.idx=i+1;
      b.innerHTML='<span class="letra">'+letras[i]+'.</span><span>'+op+'</span>';
      if(prev !== undefined){
        b.disabled=true;
        if((i+1)===p.a)b.classList.add('correct');
        if(prev===i+1&&prev!==p.a)b.classList.add('wrong');
      }else{
        b.addEventListener('click',()=>answer(p,i+1));
      }
      opcEl.appendChild(b);
    });
    if(prev !== undefined){
      resEl.style.display='block';
      if(prev===p.a){resEl.textContent='✅ Correcto';resEl.className='resultado ok';}
      else{resEl.textContent='❌ Incorrecto. La correcta es la opción '+p.a;resEl.className='resultado ko';}
    }else{
      resEl.style.display='none';resEl.className='resultado';
    }
    updateStats();
    
    if(prev === undefined){
      setTimeout(()=>{
        let t='Pregunta '+p.n+'. '+p.q+'. ';
        p.o.forEach((op,i)=>{t+='Opción '+(i+1)+': '+op+'. ';});
        speak(t, () => {
          if(handsfree) {
            setTimeout(() => startListening(), 300);
          }
        });
      }, 250);
    }
  }

  function answer(p,choose){
    listState.answers[p.n]=choose;
    saveState();
    document.querySelectorAll('.opcion').forEach(b=>{
      b.disabled=true;
      const idx=parseInt(b.dataset.idx,10);
      if(idx===p.a)b.classList.add('correct');
      if(idx===choose&&choose!==p.a)b.classList.add('wrong');
    });
    const resEl=$('resultado');
    
    if(choose===p.a){
      resEl.textContent='✅ Correcto';resEl.className='resultado ok';
      speak('Correcto.', () => {
        if(handsfree) setTimeout(() => nextQuestion(), 500);
      });
    }else{
      resEl.textContent='❌ Incorrecto. La correcta es la opción '+p.a;
      resEl.className='resultado ko';
      const msg = 'Incorrecto. La respuesta correcta es la opción ' + p.a + ': ' + p.o[p.a-1];
      speak(msg, () => {
        if(handsfree) setTimeout(() => nextQuestion(), 500);
      });
    }
    updateStats();
  }

  function updateStats(){
    let ok=0,ko=0;
    for(const k in listState.answers){
      const n=parseInt(k,10);
      const p=PREGUNTAS.find(x=>x.n===n);
      if(!p)continue;
      if(listState.answers[k]===p.a)ok++;else ko++;
    }
    $('okCount').textContent=ok;$('koCount').textContent=ko;
    const list=getList();const p=list[currentIdx];
    $('prog').textContent=(p?p.n:0)+'/300';
  }

  function initVoice(){
    if(!SR){
      micBtn.style.display='none';
      $('micStatus').textContent = 'Tu navegador no soporta micrófono.';
      return;
    }
    recognition=new SR();
    recognition.lang='es-ES';
    recognition.continuous=false;
    recognition.interimResults=false;
    recognition.maxAlternatives=3;
    
    recognition.onresult=e=>{
      const text=(e.results[0][0].transcript||'').toLowerCase().trim();
      $('micStatus').textContent='Has dicho: "'+text+'"';
      handleVoiceCommand(text);
    };
    
    recognition.onerror=e=>{
      listening=false;
      micBtn.classList.remove('escuchando');
      $('micStatus').textContent = '';
      if(e.error==='not-allowed'){
        $('micStatus').textContent='Permiso denegado. El micrófono necesita conexión segura (HTTPS).';
      }else if(e.error==='no-speech'){
        if(handsfree) setTimeout(() => startListening(), 1000);
        else $('micStatus').textContent='No te he oído. Pulsa 🎤 otra vez.';
      }else{
        $('micStatus').textContent='Error de micro: '+e.error;
      }
    };
    
    recognition.onend=()=>{
      listening=false;
      micBtn.classList.remove('escuchando');
      if(!handsfree) $('micStatus').textContent='Pulsa el micro para hablar';
    };
  }

  function startListening(){
    if(!recognition)return;
    if(listening)return;
    try{
      recognition.start();
      listening=true;
      micBtn.classList.add('escuchando');
      $('micStatus').textContent='Escuchando… Di la opción (1, 2, 3 o 4)';
    }catch(e){listening=false;}
  }

  function stopListening(){
    if(!recognition||!listening)return;
    try{recognition.stop();}catch(e){}
    listening=false;
    micBtn.classList.remove('escuchando');
    $('micStatus').textContent = handsfree ? 'Modo manos libres activo' : 'Pulsa el micro para hablar';
  }

  function handleVoiceCommand(text){
    const list=getList();const p=list[currentIdx];if(!p)return;
    const prev=listState.answers[p.n];

    if(/(siguiente|avanzar|adelante)/.test(text)){nextQuestion();return;}
    if(/(atr[aá]s|anterior|volver)/.test(text)){if(currentIdx>0){currentIdx--;stopSpeak();stopListening();render();}return;}
    if(/(repetir|repite|otra vez|escuchar)/.test(text)){$('repeat').click();return;}
    if(/(silencio|para|calla)/.test(text)){stopSpeak();return;}

    if(prev !== undefined){
      return;
    }

    let choice=null;
    if(/(^|\s)(1|uno|primera?)(\s|$)/.test(text))choice=1;
    else if(/(^|\s)(2|dos|segunda?)(\s|$)/.test(text))choice=2;
    else if(/(^|\s)(3|tres|tercera?)(\s|$)/.test(text))choice=3;
    else if(/(^|\s)(4|cuatro|cuarta?)(\s|$)/.test(text))choice=4;
    else if(/opci[oó]n\s*(1|uno)/.test(text))choice=1;
    else if(/opci[oó]n\s*(2|dos)/.test(text))choice=2;
    else if(/opci[oó]n\s*(3|tres)/.test(text))choice=3;
    else if(/opci[oó]n\s*(4|cuatro)/.test(text))choice=4;

    if(choice){
      const btn=document.querySelector('.opcion[data-idx="'+choice+'"]');
      if(btn&&!btn.disabled)btn.click();
    }else{
      if(handsfree) {
        $('micStatus').textContent = 'No te he entendido. Vuelve a decir la opción.';
        setTimeout(() => startListening(), 1000);
      } else {
        speak('No te he entendido. Di uno, dos, tres o cuatro.');
      }
    }
  }

  function nextQuestion() {
    const list = getList();
    if(currentIdx < list.length - 1){
      currentIdx++;
      stopSpeak();
      stopListening();
      render();
    }else{
      speak('Has terminado. Enhorabuena.');
      handsfreeToggle.checked = false;
      handsfree = false;
      updateHandsfreeUI();
    }
  }

  function updateHandsfreeUI() {
    if (handsfree) {
      micBtn.classList.add('handsfree');
      $('micStatus').textContent = 'Modo manos libres activo';
    } else {
      micBtn.classList.remove('handsfree');
      $('micStatus').textContent = 'Pulsa el micro para hablar';
      stopListening();
    }
  }

  handsfreeToggle.onchange = (e) => {
    handsfree = e.target.checked;
    updateHandsfreeUI();
    if (handsfree) {
      const list = getList();
      const p = list[currentIdx];
      if (p) {
        const prev = listState.answers[p.n];
        if (prev === undefined) {
          let t = 'Pregunta ' + p.n + '. ' + p.q + '. ';
          p.o.forEach((op, i) => { t += 'Opción ' + (i + 1) + ': ' + op + '. '; });
          speak(t, () => setTimeout(() => startListening(), 300));
        } else {
          nextQuestion();
        }
      }
    }
  };

  $('prev').onclick=()=>{if(currentIdx>0){currentIdx--;stopSpeak();stopListening();render();}};
  $('next').onclick=nextQuestion;
  
  $('repeat').onclick=()=>{
    stopSpeak();
    const list=getList();const p=list[currentIdx];if(!p)return;
    let t='Pregunta '+p.n+'. '+p.q+'. ';
    p.o.forEach((op,i)=>{t+='Opción '+(i+1)+': '+op+'. ';});
    speak(t, () => {
      if(handsfree) setTimeout(() => startListening(), 300);
    });
  };
  
  micBtn.onclick=()=>{
    if(listening) {
      stopListening();
      handsfreeToggle.checked = false;
      handsfree = false;
      updateHandsfreeUI();
    } else {
      startListening();
    }
  };

  $('failedMode').onclick=()=>{
    failedOnly=!failedOnly;currentIdx=0;stopSpeak();stopListening();
    $('failedMode').textContent=failedOnly?'📚 Ver todas':'📋 Solo falladas';
    render();
  };
  
  $('restart').onclick=()=>{
    if(confirm('¿Borrar todo el progreso?')){
      listState.answers={};saveState();
      currentIdx=0;stopSpeak();stopListening();render();
    }
  };
  
  $('btnTheme').onclick=()=>{
    const html=document.documentElement;
    const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
    html.setAttribute('data-theme',next);
    localStorage.setItem('test_scs_theme',next);
  };
  
  $('btnAudio').onclick=()=>{
    audioOn=!audioOn;
    $('btnAudio').textContent=audioOn?'🔊':'🔇';
    if(!audioOn)stopSpeak();
  };

  document.addEventListener('keydown',e=>{
    if(['1','2','3','4'].includes(e.key)){
      const list=getList();const p=list[currentIdx];if(!p)return;
      const btn=document.querySelector('.opcion[data-idx="'+e.key+'"]');
      if(btn&&!btn.disabled)btn.click();
    }
    if(e.key==='ArrowRight')nextQuestion();
    if(e.key==='ArrowLeft')$('prev').click();
  });

  const savedTheme=localStorage.getItem('test_scs_theme');
  if(savedTheme)document.documentElement.setAttribute('data-theme',savedTheme);
  loadState();
  
  if(synth) {
    synth.onvoiceschanged = cargarVoces;
    cargarVoces();
  }

  if(checkLoad()){
    initVoice();
    render();
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
